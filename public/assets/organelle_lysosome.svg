  <rect width="200" height="200" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.8" />
  <rect x="2" y="2" width="196" height="196" rx="22" fill="url(#cardInnerGrad)" />
  <g transform="translate(30, 28)">
    
        <!-- Shadow -->
        <ellipse cx="70" cy="118" rx="42" ry="13" fill="#0f172a" opacity="0.14" filter="url(#shadowBlur)" />

        <!-- Main Golden-Yellow Sphere -->
        <circle cx="70" cy="70" r="42" fill="url(#lysoGrad)" stroke="#b45309" stroke-width="2.5" />

        <!-- Granular Texture Spots / Enzymes -->
        <g fill="#d97706" opacity="0.55">
          <circle cx="54" cy="56" r="3" />
          <circle cx="62" cy="46" r="2" />
          <circle cx="82" cy="52" r="3.5" />
          <circle cx="46" cy="74" r="3" />
          <circle cx="60" cy="82" r="4" />
          <circle cx="76" cy="76" r="3.5" />
          <circle cx="92" cy="66" r="2.5" />
          <circle cx="88" cy="88" r="3.5" />
          <circle cx="66" cy="96" r="3" />
          <circle cx="52" cy="92" r="2.5" />
          <circle cx="78" cy="98" r="2" />
        </g>
        <g fill="#fef08a" opacity="0.75">
          <circle cx="53" cy="55" r="1.5" />
          <circle cx="81" cy="51" r="1.5" />
          <circle cx="59" cy="81" r="2" />
          <circle cx="75" cy="75" r="1.8" />
        </g>

        <!-- Big Glossy Specular Reflection -->
        <path d="M 44 46 C 50 36, 66 32, 78 34 C 68 38, 54 42, 48 54 Z" 
              fill="#ffffff" opacity="0.65" />
        <circle cx="86" cy="40" r="3.5" fill="#ffffff" opacity="0.5" />
      
  </g>
</svg>