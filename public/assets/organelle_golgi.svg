<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  
  <defs>
    <!-- Card Frame Shadows & Blurs -->
    <filter id="cardDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <filter id="organelleGroundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>

    <!-- NUKLEUS GRADIENTS (Ungu Gelap ke Ungu Muda) -->
    <radialGradient id="nucEnvelopeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="25%" stop-color="#9333ea" />
      <stop offset="60%" stop-color="#6b21a8" />
      <stop offset="90%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#2e1065" />
    </radialGradient>
    <radialGradient id="nucNucleoplasmGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>
    <radialGradient id="nucNucleolusGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="40%" stop-color="#581c87" />
      <stop offset="85%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e0538" />
    </radialGradient>
    <linearGradient id="nucPoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- BADAN GOLGI GRADIENTS (Oranye ke Kuning) -->
    <linearGradient id="golgiCisternae1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="golgiCisternae2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#fb923c" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <radialGradient id="golgiVesicleGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <!-- RETIKULUM ENDOPLASMA GRADIENTS (Biru Muda ke Biru Tua) -->
    <linearGradient id="erSheetGrad1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="erSheetGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#0ea5e9" />
      <stop offset="75%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <radialGradient id="ribosomeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="90%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </radialGradient>

    <!-- MITOKONDRIA GRADIENTS (Merah-Oranye) -->
    <linearGradient id="mitoOuterGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="30%" stop-color="#ef4444" />
      <stop offset="65%" stop-color="#dc2626" />
      <stop offset="90%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <radialGradient id="mitoMatrixGrad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="90%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#431407" />
    </radialGradient>
    <linearGradient id="cristaeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- MEMBRAN SEL GRADIENTS (Hijau Muda Transparan) -->
    <radialGradient id="lipidHeadGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#dcfce7" />
      <stop offset="35%" stop-color="#86efac" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>
    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="proteinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <radialGradient id="proteinPoreGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#172554" />
    </radialGradient>
  </defs>


  <!-- White Rounded Square Card Base Frame (Clean White Background) -->
  <rect x="2" y="2" width="236" height="236" rx="28" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

  <!-- Organelle Artwork (No Text, No Numbers) -->
  
    <!-- Soft Ground Shadow for 3D depth -->
    <ellipse cx="120" cy="187" rx="72" ry="18" fill="#0f172a" opacity="0.10" filter="url(#organelleGroundShadow)" />

    <g>
      <!-- Stack of 5 Curved Flattened Cisternae (Tumpukan 5 Kantung Pipih Melengkung) -->
      <!-- Cisterna 1 (Bottom Trans-face - Most curved) -->
      <path d="M 62 157 
               C 85 169, 155 169, 178 157
               C 186 152, 184 143, 174 143
               C 150 153, 90 153, 66 143
               C 56 143, 54 152, 62 157 Z" 
            fill="url(#golgiCisternae2)" stroke="#7c2d12" stroke-width="2" />
      <circle cx="62" cy="150" r="7" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />
      <circle cx="178" cy="150" r="7" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />

      <!-- Cisterna 2 -->
      <path d="M 56 135 
               C 82 149, 158 149, 184 135
               C 192 130, 190 121, 180 121
               C 154 133, 86 133, 60 121
               C 50 121, 48 130, 56 135 Z" 
            fill="url(#golgiCisternae1)" stroke="#9a3412" stroke-width="2" />
      <circle cx="56" cy="128" r="7.5" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />
      <circle cx="184" cy="128" r="7.5" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />

      <!-- Cisterna 3 (Middle Medial Cisterna) -->
      <path d="M 58 113 
               C 84 127, 156 127, 182 113
               C 190 108, 188 99, 178 99
               C 152 111, 88 111, 62 99
               C 52 99, 50 108, 58 113 Z" 
            fill="url(#golgiCisternae2)" stroke="#9a3412" stroke-width="2" />
      <circle cx="58" cy="106" r="7.5" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />
      <circle cx="182" cy="106" r="7.5" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />

      <!-- Cisterna 4 -->
      <path d="M 64 91 
               C 88 105, 152 105, 176 91
               C 184 86, 182 77, 172 77
               C 148 89, 92 89, 68 77
               C 58 77, 56 86, 64 91 Z" 
            fill="url(#golgiCisternae1)" stroke="#ea580c" stroke-width="2" />
      <circle cx="64" cy="84" r="7" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />
      <circle cx="176" cy="84" r="7" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />

      <!-- Cisterna 5 (Top Cis-face) -->
      <path d="M 72 69 
               C 92 81, 148 81, 168 69
               C 176 64, 174 56, 164 56
               C 144 67, 96 67, 76 56
               C 66 56, 64 64, 72 69 Z" 
            fill="url(#golgiCisternae2)" stroke="#ea580c" stroke-width="2" />
      <circle cx="74" cy="63" r="6.5" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />
      <circle cx="166" cy="63" r="6.5" fill="url(#golgiVesicleGrad)" stroke="#9a3412" stroke-width="1.5" />

      <!-- Budding & Floating Transport Vesicles (Gelembung Vesikel di Ujung-Ujung) -->
      <!-- Left side budding vesicles -->
      <circle cx="42" cy="143" r="8" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.8" />
      <circle cx="44" cy="140" r="2.5" fill="#ffffff" opacity="0.6" />

      <circle cx="48" cy="97" r="6.5" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.8" />
      <circle cx="50" cy="95" r="2" fill="#ffffff" opacity="0.6" />

      <circle cx="62" cy="49" r="5.5" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.5" />

      <!-- Right side budding vesicles -->
      <circle cx="198" cy="139" r="8.5" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.8" />
      <circle cx="200" cy="136" r="2.5" fill="#ffffff" opacity="0.6" />

      <circle cx="194" cy="100" r="7" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.8" />
      <circle cx="196" cy="98" r="2" fill="#ffffff" opacity="0.6" />

      <circle cx="176" cy="47" r="6" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.5" />

      <!-- Bottom Secretory Vesicles -->
      <circle cx="105" cy="173" r="7" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.8" />
      <circle cx="142" cy="175" r="7.5" fill="url(#golgiVesicleGrad)" stroke="#c2410c" stroke-width="1.8" />

      <!-- Glossy Curved Tubular Highlights on each layer -->
      <path d="M 82 65 Q 120 73, 158 65" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <path d="M 76 87 Q 120 95, 164 87" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
      <path d="M 72 109 Q 120 117, 168 109" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55" />
      <path d="M 72 131 Q 120 139, 168 131" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    </g>
  
</svg>